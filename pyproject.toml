[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alysia"
version = "0.1.0a22"
description = "Alysia：面向 B 站的自主创作者系统"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
keywords = ["ai-agent", "bilibili", "video-generation", "creator", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.27,<1",
    "loguru>=0.7,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "Pillow>=10,<13",
    "PyYAML>=6,<7",
    "rich>=13,<16",
    "tenacity>=8,<10",
    "typer>=0.12,<1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pip>=24",
    "pytest>=8,<10",
]

[project.scripts]
alysia = "alysia.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: requires a running external service or large local model",
    "h3_local: requires the local ComfyUI MiniMax H3 deployment",
]

[tool.setuptools.packages.find]
include = ["alysia*"]

[tool.setuptools.package-data]
"alysia.prompts" = ["*.md"]
