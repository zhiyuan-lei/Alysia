[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alysia"
version = "0.1.0a2"
description = "Alysia：面向 B 站的自主创作者系统"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "loguru>=0.7,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "PyYAML>=6,<7",
    "rich>=13,<15",
    "tenacity>=8,<10",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pip>=24",
    "pytest>=8,<10",
]

[project.scripts]
alysia = "alysia.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["alysia*"]

[tool.setuptools.package-data]
"alysia.prompts" = ["*.md"]
