name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Alysia 的 CLI 输出全是中文。Windows runner 的控制台默认是 cp1252，
  # Rich 写表格时会抛 UnicodeEncodeError，因此强制 UTF-8。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  python:
    # 本机只在 Windows 上验证过全量测试：SAPI 配音、显存探测与 FFmpeg 路径都按
    # Windows 语义实现。Linux/macOS 尚未取得实测证据，因此不放进矩阵，避免把
    # "没跑过" 伪装成 "通过"。
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install ffmpeg
        # render.mock 的 health 取决于 ffmpeg 是否在 PATH；缺了它，create 会在
        # ProductionPlan 阶段被 "render 没有满足约束的 provider" 拦下。
        run: choco install ffmpeg --no-progress -y

      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Self-check
        run: uv run python -m alysia doctor

      - name: Mock text pipeline smoke test
        # 在 runner 临时目录里跑，用 ALYSIA_CONFIG_FILE 指向仓库示例配置，
        # 避免 create 往仓库的 runs/ 与 knowledge/ 写产物。
        working-directory: ${{ runner.temp }}
        env:
          ALYSIA_CONFIG_FILE: ${{ github.workspace }}\config.example.yaml
        run: uv run --project "$env:GITHUB_WORKSPACE" python -m alysia create "为什么AI Agent还不是AGI？" --provider mock

      - name: Unit tests
        # integration 与 h3_local 需要真实的 ComfyUI 实例与 H3 权重，CI 不具备这些资源。
        # 显式按 marker 排除，而不是靠环境探测静默跳过。
        run: uv run python -m pytest tests -m "not integration and not h3_local" --disable-warnings

      - name: Working tree must stay clean
        # 测试与冒烟不允许改动已入库文件（历史上 tests/helpers.py 曾把
        # memory/workflows 写脏，EvaluationStore 曾写出 CRLF）。这条断言把这个
        # 不变量钉在 CI 里。
        # uv.lock 除外：Dependabot 或依赖区间变化时 uv sync 重写 lock 是预期行为。
        run: |
          $dirty = git status --porcelain | Where-Object { $_ -notmatch 'uv\.lock$' }
          $dirty
          if ($dirty) { throw "工作树被测试写脏了，检查新增的持久化路径" }

      - name: Frontend tests
        working-directory: control-center
        run: |
          npm ci
          npm run test -- --run
          npm run build
